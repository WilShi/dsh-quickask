name: Build Windows package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Install dependencies without native packages
        run: npm install --omit=optional --ignore-scripts
      - name: Install frontend dependencies
        run: npm --prefix quorfloat/frontend ci --ignore-scripts
      - name: Build Windows npm package
        run: npm run build:npm -- --target x86_64-pc-windows-msvc
      - name: Build self-contained Windows package
        run: npm run build -- --target x86_64-pc-windows-msvc
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-quickask-win32-x64
          path: bundles/npm/0.2.0/*.tgz
      - name: Upload self-contained package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-quickask-win32-self-contained
          path: bundles/dsh-quickask-0.2.0-win32.tgz
